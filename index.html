<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4v2 Rondo — Game Habit #2: Raise Your Head and Look</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a0a0a;font-family:'Barlow',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:16px;color:#fff;}

  .header{text-align:center;margin-bottom:10px;}
  .header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:21px;
    letter-spacing:2px;text-transform:uppercase;color:#C61D23;}
  .header p{font-size:11px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}

  .phase-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;color:#fff;background:#C61D23;
    padding:4px 16px;margin-bottom:8px;min-width:300px;text-align:center;}

  .score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;
    font-family:'Barlow Condensed',sans-serif;}
  .score-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#555;transition:color .3s;}
  .pips{display:flex;gap:3px;}
  .pip{width:20px;height:20px;border-radius:3px;border:1px solid #222;background:#111;
    transition:background .35s,border-color .35s;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:#333;}
  .pip.on   {background:#C61D23;border-color:#C61D23;color:#fff;}
  .pip.split{background:#f0a500;border-color:#f0a500;color:#fff;}
  .pip.win  {background:#22b56e;border-color:#22b56e;color:#fff;}

  .scene{position:relative;width:490px;height:510px;}
  .field-bg{position:absolute;inset:0;background:#14481a;
    background-image:repeating-linear-gradient(180deg,transparent,transparent 51px,
      rgba(255,255,255,.03) 51px,rgba(255,255,255,.03) 102px);}

  .grid{position:absolute;background:#1a5c1a;
    border:2px solid rgba(255,255,255,.8);
    transition:border-color .4s,opacity .5s;}
  .grid.flash-split{border-color:#f0a500;}
  .grid.flash-win  {border-color:#22b56e;}

  .grid-lbl{position:absolute;font-family:'Barlow Condensed',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:#999;}

  .player{position:absolute;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#fff;
    border:2px solid rgba(255,255,255,.2);
    transition:left .72s cubic-bezier(.4,0,.2,1),top .72s cubic-bezier(.4,0,.2,1),opacity .45s;
    z-index:10;}
  .player.red {background:#C61D23;box-shadow:0 0 8px rgba(198,29,35,.4);}
  .player.blue{background:#1a6eb5;box-shadow:0 0 8px rgba(26,110,181,.4);}
  .player.has-ball{border-color:#fff;border-width:3px;}

  /* Body + head markers (Game Habits) */
  .plabel{position:relative;z-index:3;}
  .pbody,.phead{position:absolute;inset:0;pointer-events:none;}
  .pbody{transform:rotate(var(--bd,0deg));}      /* shoulder line = body facing */
  .phead{transform:rotate(var(--hd,0deg));}      /* eyes + cone = head facing  */
  .shoulders{position:absolute;top:50%;left:50%;width:27px;height:4.5px;border-radius:3px;
    background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6);transform:translate(-50%,-50%);}
  .chest{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid #fff;}
  .eyes{position:absolute;top:1px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:4;}
  .eyes i{display:block;width:3.6px;height:3.6px;border-radius:50%;background:#fff;
    box-shadow:0 0 2px rgba(0,0,0,.8);}
  .cone{position:absolute;left:50%;bottom:50%;width:88px;height:44px;transform:translateX(-50%);
    background:linear-gradient(to top,rgba(255,236,110,.92),rgba(255,236,110,.05));
    filter:drop-shadow(0 0 5px rgba(255,236,110,.65));
    clip-path:polygon(50% 100%,0 0,100% 0);opacity:0;transition:opacity .3s;}
  .player.scanning .cone,.player.seeing .cone{opacity:1;}
  .player.headdown .eyes i{opacity:.25;background:#777;box-shadow:none;height:1.6px;border-radius:1px;} /* head down = eyes lowered, not looking up */
  .player.scanning .phead{animation:scanSweep 1.6s ease-in-out infinite;}
  @keyframes scanSweep{0%,100%{transform:rotate(calc(var(--hd,0deg) - 38deg));}
    50%{transform:rotate(calc(var(--hd,0deg) + 38deg));}}

  .ball{position:absolute;width:14px;height:14px;border-radius:50%;
    background:#fff;border:1px solid #ccc;z-index:20;
    transition:left .72s cubic-bezier(.4,0,.2,1),top .72s cubic-bezier(.4,0,.2,1),opacity .45s;
    box-shadow:0 0 9px rgba(255,255,255,.9);}

  .arr-svg{position:absolute;top:0;left:0;width:490px;height:510px;pointer-events:none;z-index:8;}

  .flash{position:absolute;pointer-events:none;opacity:0;transition:opacity .28s;z-index:6;}
  .flash.show{opacity:1;}

  .ftxt{position:absolute;pointer-events:none;opacity:0;transition:opacity .28s;z-index:30;
    font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:3px;
    text-transform:uppercase;white-space:nowrap;text-shadow:0 0 14px currentColor;}
  .ftxt.show{opacity:1;}

  /* Coaching highlight banner — pulses to draw the eye */
  .hi-txt{left:245px;top:46px;transform:translateX(-50%);
    font-size:16px;color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.85);
    white-space:normal;max-width:300px;text-align:center;line-height:1.3;
    letter-spacing:1.5px;}
  .hi-txt.show{animation:hiIntro .85s ease-out 1 both;}
  @keyframes hiIntro{0%{opacity:0;}30%{opacity:1;}55%{opacity:.2;}100%{opacity:1;}}

  /* Flashing pointer — calls out the head-down player from outside the box */
  .point-arr{opacity:0;stroke:#ff3b3b;stroke-width:3.2;stroke-linecap:round;}
  .point-arr.show{animation:ptFlash .6s ease-in-out infinite;}
  @keyframes ptFlash{0%,100%{opacity:1;}50%{opacity:.12;}}

  /* Guide reference lines — show players are off the same line */
  .guide{opacity:0;stroke:rgba(120,200,255,.85);stroke-width:1.6;stroke-dasharray:5,4;
    transition:opacity .4s;}
  .guide.show{opacity:1;}

  /* Option arrows — flash a few times then sit */
  .opt-arr{opacity:0;}
  .opt-arr.show{animation:optFlash 1s ease-out 1 both;}
  @keyframes optFlash{0%{opacity:0;}15%{opacity:1;}30%{opacity:.15;}45%{opacity:1;}
    60%{opacity:.2;}75%{opacity:1;}100%{opacity:1;}}

  /* Space highlight zone — white wash over the open space the text describes */
  .zone{position:absolute;border:2px dashed rgba(255,255,255,.7);border-radius:5px;
    opacity:0;transition:opacity .45s;z-index:5;pointer-events:none;
    display:flex;align-items:center;justify-content:center;}
  .zone.show{opacity:1;animation:zonePulse 1.6s ease-in-out infinite;}
  @keyframes zonePulse{0%,100%{background:rgba(255,255,255,.06);}50%{background:rgba(255,255,255,.2);}}
  .zone-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);}

  .legend{display:flex;gap:14px;margin-top:8px;justify-content:center;}
  .leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#bbb;
    font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;}
  .ld{width:12px;height:12px;border-radius:50%;}
  .ld.red{background:#C61D23;} .ld.blue{background:#1a6eb5;} .ld.gold{background:#f0a500;border-radius:2px;}

  .step-indicators{display:flex;gap:6px;margin-top:9px;}
  .step-dot{width:7px;height:7px;border-radius:50%;background:#222;transition:background .3s;}
  .step-dot.active{background:#C61D23;} .step-dot.done{background:#444;}

  .desc{font-size:11px;color:#585858;text-align:center;max-width:440px;
    margin-top:6px;line-height:1.5;min-height:28px;}

  .controls{display:flex;gap:8px;margin-top:10px;}
  .btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border:none;cursor:pointer;transition:all .2s;}
  .btnp{background:#C61D23;color:#fff;} .btnp:hover{background:#e02228;}
  .btns{background:transparent;color:#555;border:1px solid #222;} .btns:hover{border-color:#555;color:#bbb;}

  /* TSI Logo */
  .tsi-logo-wrap{display:flex;justify-content:center;padding:0 0 12px;width:100%;}
  .tsi-logo{height:38px;width:auto;display:block;}
</style>

// Grid: L130, T140, W230, H230 → centre [245,255]
// Player div: 26px → top-left = centre - 13 ; Ball div: 14px → centre - 7
const pp = (cx,cy) => [cx-13, cy-13];

// Ball next to player, offset ~17px toward grid centre
function bNear(cx,cy, gcx,gcy){
  const dx=gcx-cx, dy=gcy-cy, len=Math.sqrt(dx*dx+dy*dy)||1, d=17;
  return [cx+dx/len*d-7, cy+dy/len*d-7];
}
// Arrow path between two centres, offset 14px from each end
function arw(fx,fy,tx,ty){
  const dx=tx-fx, dy=ty-fy, len=Math.sqrt(dx*dx+dy*dy)||1;
  const ox=dx/len*14, oy=dy/len*14;
  return `M${fx+ox},${fy+oy} L${tx-ox},${ty-oy}`;
}

// ── Create players ─────────────────────────────────────────────────────
const scene = document.querySelector('.scene');
const els = { r:[], b:[], ball:null };
function mkP(t,lbl){
  const e=document.createElement('div'); e.className=`player ${t}`;
  e.innerHTML = `<span class="plabel">${lbl}</span>` + (t==='red'
    ? `<div class="pbody"><span class="shoulders"></span><span class="chest"></span></div>
       <div class="phead"><span class="cone"></span><span class="eyes"><i></i><i></i></span></div>`
    : '');
  scene.appendChild(e); return e;
}
['L','T','R','B'].forEach(n=>els.r.push(mkP('red',n)));
[1,2].forEach(n=>els.b.push(mkP('blue',n)));
els.ball=document.createElement('div'); els.ball.className='ball'; scene.appendChild(els.ball);

// ── Apply phase ────────────────────────────────────────────────────────
let current=0, isAuto=false, timer=null;

function applyPhase(idx){
  const ph=PH[idx];
  const g=ph.pl;
  const bc=[ph.ball[0]+6.5, ph.ball[1]+6.5];   // ball centre
  els.r.forEach((el,i)=>{
    el.style.left=pp(g[i][0],g[i][1])[0]+'px';
    el.style.top =pp(g[i][0],g[i][1])[1]+'px';
    el.classList.toggle('has-ball', ph.passer===i);
    // Facing: body + head point at a target. Default = ball; `open` = grid centre (sideways to the
    // line, chest into the field); `face:{i:[x,y]}` = explicit target. Shoulders sit perpendicular.
    let tgt = bc;
    if(ph.open && ph.open.includes(i)) tgt=[GC[0],GC[1]];
    if(ph.face && ph.face[i]) tgt=ph.face[i];
    const ang = Math.atan2(tgt[0]-g[i][0], -(tgt[1]-g[i][1]))*180/Math.PI;
    el.style.setProperty('--bd', ang+'deg');
    el.style.setProperty('--hd', ang+'deg');
    el.classList.toggle('scanning', !!(ph.scan && ph.scan.includes(i)));
    el.classList.toggle('seeing', !!(ph.cone && ph.cone.includes(i)));
    el.classList.toggle('headdown', !!(ph.down && ph.down.includes(i)));
  });
  els.b.forEach((el,i)=>{
    el.style.left=pp(g[4+i][0],g[4+i][1])[0]+'px';
    el.style.top =pp(g[4+i][0],g[4+i][1])[1]+'px';
  });
  els.ball.style.left=ph.ball[0]+'px'; els.ball.style.top=ph.ball[1]+'px';

  // Grid border + flashes
  const gbox=document.getElementById('gbox');
  gbox.className='grid'+(ph.splitP?' flash-split':ph.winP?' flash-win':'');
  document.getElementById('fSplit').classList.toggle('show',ph.splitP);
  document.getElementById('fWin').classList.toggle('show',ph.winP);
  document.getElementById('ftSplit').classList.toggle('show',ph.splitP);
  document.getElementById('ftWin').classList.toggle('show',ph.winP);

  // Coaching highlight banner — flash once, then sit
  const ftHi=document.getElementById('ftHi');
  ftHi.classList.remove('show');
  if(ph.hi){ ftHi.textContent=ph.hi; void ftHi.offsetWidth; ftHi.classList.add('show'); }
  else ftHi.textContent='';

  // Option arrows — data-driven: ph.optArrows = [{f:[x,y], t:[x,y], c:'w'|'g'}, ...]
  ['opt1','opt2','opt3'].forEach((id,i)=>{
    const e=document.getElementById(id);
    const spec=ph.optArrows && ph.optArrows[i];
    e.classList.remove('show');
    if(spec){
      e.setAttribute('d', arw(spec.f[0],spec.f[1],spec.t[0],spec.t[1]));
      const gold = spec.c==='g';
      e.setAttribute('stroke', gold?'#f0a500':'rgba(255,255,255,.95)');
      e.setAttribute('marker-end', gold?'url(#mG)':'url(#mW)');
      void e.getBoundingClientRect(); e.classList.add('show');
    }
  });

  // Guide reference lines — ph.guides = {a:y1, b:y2} across the grid
  ['gl1','gl2'].forEach((id,i)=>{
    const e=document.getElementById(id);
    const y=ph.guides && (i===0?ph.guides.a:ph.guides.b);
    if(y!=null){ e.setAttribute('d',`M130,${y} L360,${y}`); e.classList.add('show'); }
    else e.classList.remove('show');
  });

  // Flashing pointer — ph.pointAt = {sx,sy,ex,ey} (outside the box → at the player)
  const pa=document.getElementById('pointArr');
  if(ph.pointAt){
    pa.setAttribute('d',`M${ph.pointAt.sx},${ph.pointAt.sy} L${ph.pointAt.ex},${ph.pointAt.ey}`);
    pa.classList.add('show');
  } else pa.classList.remove('show');

  // Space highlight zone
  const zone=document.getElementById('zone');
  if(ph.zone){
    zone.style.left=ph.zone.l+'px'; zone.style.top=ph.zone.t+'px';
    zone.style.width=ph.zone.w+'px'; zone.style.height=ph.zone.h+'px';
    document.getElementById('zoneLbl').textContent=ph.zone.label||'';
    zone.classList.add('show');
  } else zone.classList.remove('show');

  // UI
  document.getElementById('phaseLabel').textContent=ph.label;
  document.getElementById('desc').textContent=ph.desc;
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active',i===idx);
    d.classList.toggle('done',i<idx);
  });
  document.getElementById('prevBtn').style.opacity=idx===0?'0.3':'1';
  document.getElementById('nextBtn').style.opacity=idx===PH.length-1?'0.3':'1';
}

function go(dir){
  const n=Math.max(0,Math.min(PH.length-1,current+dir));
  if(n!==current){current=n;applyPhase(current);}
  if(current===PH.length-1&&isAuto) stopAuto();
}
function toggleAuto(){
  if(isAuto){stopAuto();return;}
  isAuto=true; document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===PH.length-1){current=0;applyPhase(0);}
  timer=setInterval(()=>{
    if(current<PH.length-1){current++;applyPhase(current);}
    else stopAuto();
  },4500);
}
function stopAuto(){
  isAuto=false;clearInterval(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

// Init
PH.forEach((_,i)=>{ const d=document.createElement('div'); d.className='step-dot'; document.getElementById('stepDots').appendChild(d); });
applyPhase(0);
</script>
